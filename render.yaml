services:
  - type: web
    name: doctor-tracker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        value: https://doctor-tracker-backend-gfj8.onrender.com/api
      - key: SEED_ON_START
        value: true
      - key: SEED_ADMIN_NAME
        value: Demo Administrator
      - key: SEED_ADMIN_EMAIL
        value: admin@doctortracker.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_VIEWER_NAME
        value: Demo Viewer
      - key: SEED_VIEWER_EMAIL
        value: viewer@doctortracker.local
      - key: SEED_VIEWER_PASSWORD
        sync: false

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/doctor_tracker
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-development-secret}
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Demo Administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@doctortracker.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
